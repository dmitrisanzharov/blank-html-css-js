<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Dashboard - Full Mockup with Sample Data</title>

    <!-- Material UI and React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .drag-handle {
            cursor: grab;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .item-row:hover .drag-handle {
            opacity: 0.6;
        }
        .drag-handle:hover {
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {
            Box,
            Card,
            CardContent,
            IconButton,
            Skeleton,
            Tooltip,
            Typography,
            ThemeProvider,
            createTheme,
            CssBaseline,
            Divider,
            Chip,
            Switch,
            FormControlLabel,
            LinearProgress,
            Button,
            Paper
        } = MaterialUI;

        const theme = createTheme();
        const gridGap = 4;

        // Icons for Items to Address
        const WarningAmberIcon = () => <span className="material-icons" style={{color: '#ed6c02', fontSize: 20}}>warning_amber</span>;
        const ErrorOutlineIcon = () => <span className="material-icons" style={{color: '#d32f2f', fontSize: 20}}>error_outline</span>;
        const CarIcon = () => <span className="material-icons" style={{color: '#00b050', fontSize: 20}}>directions_car</span>;
        const SpeedIcon = () => <span className="material-icons" style={{color: '#1976d2', fontSize: 20}}>speed</span>;
        const BatteryAlertIcon = () => <span className="material-icons" style={{color: '#d32f2f', fontSize: 20}}>battery_alert</span>;
        const BuildIcon = () => <span className="material-icons" style={{color: '#f57c00', fontSize: 20}}>build</span>;
        const ScheduleIcon = () => <span className="material-icons" style={{color: '#d32f2f', fontSize: 20}}>schedule</span>;
        const DescriptionIcon = () => <span className="material-icons" style={{color: '#1976d2', fontSize: 20}}>description</span>;
        const EventBusyIcon = () => <span className="material-icons" style={{color: '#ed6c02', fontSize: 20}}>event_busy</span>;
        const AssignmentLateIcon = () => <span className="material-icons" style={{color: '#d32f2f', fontSize: 20}}>assignment_late</span>;
        const LocalShippingIcon = () => <span className="material-icons" style={{color: '#9c27b0', fontSize: 20}}>local_shipping</span>;

        const ArrowForwardIcon = () => <span className="material-icons" style={{fontSize: 18}}>arrow_forward</span>;
        const MapIcon = () => <span className="material-icons" style={{fontSize: 18}}>map</span>;
        const EditIcon = () => <span className="material-icons">edit</span>;
        const DragIcon = () => <span className="material-icons drag-handle" style={{fontSize: 18}}>drag_indicator</span>;
        const VisibilityIcon = () => <span className="material-icons" style={{fontSize: 18}}>visibility</span>;
        const VisibilityOffIcon = () => <span className="material-icons" style={{fontSize: 18}}>visibility_off</span>;
        const RestoreIcon = () => <span className="material-icons" style={{fontSize: 18}}>restart_alt</span>;
        const SaveIcon = () => <span className="material-icons" style={{fontSize: 18}}>check</span>;

        // Custom Tooltip Component
        const TooltipContent = ({ title, content }) => (
            <Box>
                <Typography variant="body2" sx={{ fontWeight: 600, mb: 0.5 }}>{title}</Typography>
                <Box component='ul' sx={{ pl: 2, m: 0 }}>
                    {content?.map((item, index) => (
                        <Typography variant='caption' component="li" key={item + index}>
                            {item}
                        </Typography>
                    ))}
                </Box>
            </Box>
        );

        const CustomTooltip = ({ title, content, children }) => (
            <Tooltip
                arrow
                title={<TooltipContent title={title} content={content} />}
                componentsProps={{
                    tooltip: {
                        sx: { maxWidth: 250 }
                    }
                }}
            >
                {children}
            </Tooltip>
        );

        // Issue Item Row Component
        const IssueItemRow = ({ issue, loading, editMode, visible, onToggleVisibility }) => {
            return (
                <Box
                    className="item-row"
                    sx={{
                        py: 1.5,
                        px: 2,
                        display: 'flex',
                        alignItems: 'flex-start',
                        gap: 1.5,
                        opacity: visible ? 1 : 0.4,
                        '&:hover': {
                            backgroundColor: 'rgba(0,0,0,0.02)'
                        }
                    }}
                >
                    {editMode && <Box sx={{ pt: 0.5 }}><DragIcon /></Box>}

                    <Box sx={{ display: 'flex', alignItems: 'center', minWidth: 28, pt: 0.5 }}>
                        {issue.icon}
                    </Box>

                    <Box sx={{ flex: 1 }}>
                        <CustomTooltip title={issue.title} content={issue.tooltipContent}>
                            <Typography
                                variant="body2"
                                sx={{
                                    fontWeight: 500,
                                    cursor: 'pointer',
                                    lineHeight: 1.3,
                                    '&:hover': { color: 'primary.main' }
                                }}
                            >
                                {issue.title}
                            </Typography>
                        </CustomTooltip>
                        <Typography variant="caption" color="text.secondary" sx={{ display: 'block', mt: 0.25 }}>
                            Related to: {issue.job}
                        </Typography>
                    </Box>

                    {!editMode && issue.actions?.find(a => a.tooltip.includes('Map')) && (
                        <Box sx={{ pt: 0.5 }}>
                            <Tooltip title={issue.actions.find(a => a.tooltip.includes('Map')).tooltip}>
                                <IconButton size='small' disabled={loading || issue.count === 0}>
                                    {issue.actions.find(a => a.tooltip.includes('Map')).icon}
                                </IconButton>
                            </Tooltip>
                        </Box>
                    )}

                    <Box sx={{ pt: 0.5 }}>
                        <Typography
                            variant="h6"
                            sx={{
                                minWidth: 40,
                                textAlign: 'right',
                                fontWeight: 600,
                                color: issue.count === 0 ? 'text.disabled' : 'text.primary'
                            }}
                        >
                            {loading ? <Skeleton width={32} /> : issue.count.toLocaleString()}
                        </Typography>
                    </Box>

                    {editMode ? (
                        <Box sx={{ pt: 0.5 }}>
                            <IconButton
                                size='small'
                                onClick={() => onToggleVisibility(issue.id)}
                                sx={{ ml: 0.5 }}
                            >
                                {visible ? <VisibilityIcon /> : <VisibilityOffIcon />}
                            </IconButton>
                        </Box>
                    ) : (
                        <Box sx={{ pt: 0.5 }}>
                            {issue.actions?.filter(a => !a.tooltip.includes('Map')).map((action, idx) => (
                                <Tooltip title={action.tooltip} key={idx}>
                                    <IconButton size='small' disabled={loading || issue.count === 0}>
                                        {action.icon}
                                    </IconButton>
                                </Tooltip>
                            ))}
                        </Box>
                    )}
                </Box>
            );
        };

        // ITEMS TO ADDRESS WIDGET - Using exact code from prototype
        const IssuesToAddressCard = ({
            availableDeviceIssues = 0,
            stockAnomalies = 0,
            inactiveNrms = 0,
            highMileageVehicles = 0,
            lowBatteryAlerts = 0,
            serviceOverdue = 0,
            maintenanceOverdue = 0,
            nrmOverdue = 0,
            rentalOverdue = 0,
            missingDocuments = 0,
            expiringDocuments = 0,
            loading = false,
            sx
        }) => {
            const defaultVisibility = {
                deviceIssues: true,
                stockAnomalies: true,
                inactiveNrms: true,
                highMileage: true,
                lowBattery: true,
                serviceOverdue: true,
                maintenanceOverdue: true,
                nrmOverdue: true,
                rentalOverdue: true,
                missingDocs: true,
                expiringDocs: true
            };

            const [editMode, setEditMode] = React.useState(false);
            const [savedVisibility, setSavedVisibility] = React.useState(defaultVisibility);
            const [visibility, setVisibility] = React.useState(defaultVisibility);
            const [hideZeroCounts, setHideZeroCounts] = React.useState(false);
            const [savedHideZeroCounts, setSavedHideZeroCounts] = React.useState(false);

            const HIGH_MILEAGE_LIMIT = 100000;

            const issues = [
                {
                    id: 'deviceIssues',
                    title: 'Available with Device Anomalies',
                    icon: <WarningAmberIcon />,
                    count: availableDeviceIssues,
                    job: 'Fleet Coverage',
                    tooltipContent: [
                        'Vehicles marked as Available',
                        'With a device anomaly or issue',
                        'Click to view the full list'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View Anomalies' }
                    ]
                },
                {
                    id: 'stockAnomalies',
                    title: 'Stock Anomalies',
                    icon: <ErrorOutlineIcon />,
                    count: stockAnomalies,
                    job: 'Utilisation',
                    tooltipContent: [
                        'Vehicles in Stock status',
                        'That have not been moved in over 7 days',
                        'Click to view the full list'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View Anomalies' }
                    ]
                },
                {
                    id: 'inactiveNrms',
                    title: 'Inactive NRMs',
                    icon: <CarIcon />,
                    count: inactiveNrms,
                    job: 'Utilisation',
                    tooltipContent: [
                        "Vehicles marked as NRM (Needs Repair/Maintenance)",
                        "That have not been moved in the last 7 days"
                    ],
                    actions: [
                        { icon: <MapIcon />, tooltip: 'View on Map' },
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'highMileage',
                    title: 'High Mileage Vehicles',
                    icon: <SpeedIcon />,
                    count: highMileageVehicles,
                    job: 'Fleet Value',
                    tooltipContent: [
                        `Vehicles with estimated mileage over ${HIGH_MILEAGE_LIMIT.toLocaleString()} KM`
                    ],
                    actions: [
                        { icon: <MapIcon />, tooltip: 'View on Map' },
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'lowBattery',
                    title: 'Low Battery Alerts',
                    icon: <BatteryAlertIcon />,
                    count: lowBatteryAlerts,
                    job: 'Fleet Coverage',
                    tooltipContent: [
                        'Vehicles with low battery warnings',
                        'Battery may need replacement or charging',
                        'Could affect device functionality'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View Alerts' }
                    ]
                },
                {
                    id: 'serviceOverdue',
                    title: 'Service Overdue',
                    icon: <BuildIcon />,
                    count: serviceOverdue,
                    job: 'Fleet Value',
                    tooltipContent: [
                        'Vehicles past their scheduled service date',
                        'Service is required to maintain warranty',
                        'May impact vehicle reliability'
                    ],
                    actions: [
                        { icon: <MapIcon />, tooltip: 'View on Map' },
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'maintenanceOverdue',
                    title: 'Maintenance Overdue',
                    icon: <ScheduleIcon />,
                    count: maintenanceOverdue,
                    job: 'Fleet Value',
                    tooltipContent: [
                        'Vehicles with overdue maintenance alerts',
                        'Scheduled maintenance has not been completed',
                        'Review maintenance history'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'nrmOverdue',
                    title: 'NRM Overdue',
                    icon: <AssignmentLateIcon />,
                    count: nrmOverdue,
                    job: 'Utilisation',
                    tooltipContent: [
                        'Vehicles in NRM status for extended period',
                        'May require status update or action',
                        'Check repair/maintenance progress'
                    ],
                    actions: [
                        { icon: <MapIcon />, tooltip: 'View on Map' },
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'rentalOverdue',
                    title: 'Rental Overdue',
                    icon: <EventBusyIcon />,
                    count: rentalOverdue,
                    job: 'Utilisation',
                    tooltipContent: [
                        'Vehicles on rent past their return date',
                        'Customer has not returned the vehicle',
                        'Follow up required'
                    ],
                    actions: [
                        { icon: <MapIcon />, tooltip: 'View on Map' },
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'missingDocs',
                    title: 'Missing Documents',
                    icon: <DescriptionIcon />,
                    count: missingDocuments,
                    job: 'Fleet Value',
                    tooltipContent: [
                        'Vehicles with missing required documentation',
                        'May include insurance, registration, or certificates',
                        'Upload documents to resolve'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                },
                {
                    id: 'expiringDocs',
                    title: 'Expiring Documents',
                    icon: <LocalShippingIcon />,
                    count: expiringDocuments,
                    job: 'Fleet Value',
                    tooltipContent: [
                        'Vehicles with documents expiring soon',
                        'Includes insurance, MOT, tax, and licenses',
                        'Renew before expiration date'
                    ],
                    actions: [
                        { icon: <ArrowForwardIcon />, tooltip: 'View List' }
                    ]
                }
            ];

            const toggleVisibility = (id) => {
                setVisibility(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const handleReset = () => {
                setVisibility(defaultVisibility);
                setHideZeroCounts(false);
            };

            const handleSave = () => {
                setSavedVisibility(visibility);
                setSavedHideZeroCounts(hideZeroCounts);
                setEditMode(false);
            };

            const handleCancelEdit = () => {
                setVisibility(savedVisibility);
                setHideZeroCounts(savedHideZeroCounts);
                setEditMode(false);
            };

            const visibleIssues = editMode
                ? issues.filter(issue => visibility[issue.id])
                : issues.filter(issue => {
                    if (!savedVisibility[issue.id]) return false;
                    if (savedHideZeroCounts && issue.count === 0) return false;
                    return true;
                });

            const hiddenIssues = editMode
                ? issues.filter(issue => !visibility[issue.id])
                : [];

            const totalIssues = issues.reduce((sum, issue) => sum + issue.count, 0);

            return (
                <Card sx={sx}>
                    <Box sx={{
                        p: 1.5,
                        pb: 1,
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        borderBottom: editMode ? '1px solid rgba(0,0,0,0.12)' : 'none'
                    }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                            <Typography variant='h6' component='div'>
                                Items To Address
                            </Typography>
                            <Chip
                                label={totalIssues}
                                size="small"
                                sx={{
                                    backgroundColor: totalIssues > 0 ? '#FFA500' : '#ccc',
                                    color: 'white',
                                    fontWeight: 600,
                                    height: 22
                                }}
                            />
                        </Box>
                        {!editMode ? (
                            <Tooltip title="Edit Items to Address">
                                <IconButton size='small' onClick={() => setEditMode(true)}>
                                    <EditIcon />
                                </IconButton>
                            </Tooltip>
                        ) : (
                            <Box sx={{ display: 'flex', gap: 1 }}>
                                <Tooltip title="Reset to defaults">
                                    <IconButton size='small' onClick={handleReset}>
                                        <RestoreIcon />
                                    </IconButton>
                                </Tooltip>
                                <Tooltip title="Cancel">
                                    <IconButton size='small' onClick={handleCancelEdit}>
                                        <span className="material-icons" style={{fontSize: 18}}>close</span>
                                    </IconButton>
                                </Tooltip>
                                <Tooltip title="Save changes">
                                    <IconButton
                                        size='small'
                                        onClick={handleSave}
                                        sx={{
                                            backgroundColor: 'primary.main',
                                            color: 'white',
                                            '&:hover': { backgroundColor: 'primary.dark' }
                                        }}
                                    >
                                        <SaveIcon />
                                    </IconButton>
                                </Tooltip>
                            </Box>
                        )}
                    </Box>

                    {editMode && (
                        <Box sx={{ px: 2, py: 1.5, backgroundColor: 'rgba(0,0,0,0.02)', borderBottom: '1px solid rgba(0,0,0,0.12)' }}>
                            <FormControlLabel
                                control={
                                    <Switch
                                        checked={hideZeroCounts}
                                        onChange={(e) => setHideZeroCounts(e.target.checked)}
                                        size="small"
                                    />
                                }
                                label={
                                    <Typography variant="caption">
                                        Hide items with zero count
                                    </Typography>
                                }
                            />
                            <Typography variant="caption" color="text.secondary" display="block" sx={{ mt: 0.5 }}>
                                Drag items to reorder • Toggle visibility with eye icon • Click save to apply changes
                            </Typography>
                        </Box>
                    )}

                    <Box>
                        {editMode ? (
                            <>
                                {visibleIssues.length > 0 && (
                                    <>
                                        <Box sx={{ px: 2, py: 1, backgroundColor: 'rgba(0,0,0,0.02)' }}>
                                            <Typography variant="caption" sx={{ fontWeight: 600, color: 'text.secondary' }}>
                                                VISIBLE ITEMS ({visibleIssues.length})
                                            </Typography>
                                        </Box>
                                        {visibleIssues.map((issue, index) => (
                                            <React.Fragment key={issue.id}>
                                                {index > 0 && <Divider />}
                                                <IssueItemRow
                                                    issue={issue}
                                                    loading={loading}
                                                    editMode={editMode}
                                                    visible={true}
                                                    onToggleVisibility={toggleVisibility}
                                                />
                                            </React.Fragment>
                                        ))}
                                    </>
                                )}

                                {hiddenIssues.length > 0 && (
                                    <>
                                        <Divider sx={{ borderStyle: 'dashed' }} />
                                        <Box sx={{ px: 2, py: 1, backgroundColor: 'rgba(0,0,0,0.02)' }}>
                                            <Typography variant="caption" sx={{ fontWeight: 600, color: 'text.secondary' }}>
                                                HIDDEN ITEMS ({hiddenIssues.length})
                                            </Typography>
                                        </Box>
                                        {hiddenIssues.map((issue, index) => (
                                            <React.Fragment key={issue.id}>
                                                {index > 0 && <Divider />}
                                                <IssueItemRow
                                                    issue={issue}
                                                    loading={loading}
                                                    editMode={editMode}
                                                    visible={false}
                                                    onToggleVisibility={toggleVisibility}
                                                />
                                            </React.Fragment>
                                        ))}
                                    </>
                                )}
                            </>
                        ) : (
                            <>
                                {visibleIssues.map((issue, index) => (
                                    <React.Fragment key={issue.id}>
                                        {index > 0 && <Divider />}
                                        <IssueItemRow
                                            issue={issue}
                                            loading={loading}
                                            editMode={false}
                                            visible={true}
                                            onToggleVisibility={toggleVisibility}
                                        />
                                    </React.Fragment>
                                ))}
                            </>
                        )}
                    </Box>
                </Card>
            );
        };

        // Mock widgets with sample data
        const TitleCard = ({ sx }) => (
            <Card sx={sx}>
                <CardContent>
                    <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 2 }}>
                        <Box>
                            <Typography variant="overline" color="text.secondary">Total Fleet</Typography>
                            <Typography variant="h3" sx={{ fontWeight: 600 }}>1,247</Typography>
                            <Typography variant="caption" color="text.secondary">devices</Typography>
                        </Box>
                        <Box>
                            <Typography variant="overline" color="text.secondary">On Rent</Typography>
                            <Typography variant="h4" sx={{ color: '#4caf50', fontWeight: 600 }}>896</Typography>
                            <Typography variant="caption" color="text.secondary">72% utilisation</Typography>
                        </Box>
                        <Box>
                            <Typography variant="overline" color="text.secondary">Available</Typography>
                            <Typography variant="h4" sx={{ color: '#2196f3', fontWeight: 600 }}>283</Typography>
                            <Typography variant="caption" color="text.secondary">23%</Typography>
                        </Box>
                        <Box>
                            <Typography variant="overline" color="text.secondary">NRM</Typography>
                            <Typography variant="h4" sx={{ color: '#ff9800', fontWeight: 600 }}>68</Typography>
                            <Typography variant="caption" color="text.secondary">5%</Typography>
                        </Box>
                    </Box>
                </CardContent>
            </Card>
        );

        const UtilizationCard = ({ sx }) => (
            <Card sx={sx}>
                <CardContent>
                    <Typography variant='h6' gutterBottom>Utilisation</Typography>
                    <Box sx={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                        <Box sx={{ flex: 1 }}>
                            <Box sx={{ width: 140, height: 140, mx: 'auto', position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <svg width="140" height="140" viewBox="0 0 140 140">
                                    <circle cx="70" cy="70" r="60" fill="none" stroke="#e0e0e0" strokeWidth="20"/>
                                    <circle cx="70" cy="70" r="60" fill="none" stroke="#4caf50" strokeWidth="20" strokeDasharray="271" strokeDashoffset="75" transform="rotate(-90 70 70)"/>
                                </svg>
                                <Box sx={{ position: 'absolute', textAlign: 'center' }}>
                                    <Typography variant="h4" sx={{ fontWeight: 600 }}>72%</Typography>
                                    <Typography variant="caption">on rent</Typography>
                                </Box>
                            </Box>
                            <Box sx={{ mt: 2 }}>
                                <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                                    <Typography variant="body2">On Rent</Typography>
                                    <Typography variant="body2" fontWeight={600}>896</Typography>
                                </Box>
                                <Box sx={{ display: 'flex', justifyContent: 'space-between', mb: 0.5 }}>
                                    <Typography variant="body2">Available</Typography>
                                    <Typography variant="body2" fontWeight={600}>283</Typography>
                                </Box>
                                <Box sx={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <Typography variant="body2">NRM</Typography>
                                    <Typography variant="body2" fontWeight={600}>68</Typography>
                                </Box>
                            </Box>
                        </Box>
                        <Box sx={{ flex: 1 }}>
                            <Typography variant="caption" color="text.secondary" gutterBottom>7-Day Trend</Typography>
                            <Box sx={{ height: 200, backgroundColor: '#f5f5f5', borderRadius: 1, p: 1, display: 'flex', alignItems: 'flex-end', gap: 0.5 }}>
                                {[68, 71, 69, 74, 72, 70, 72].map((val, i) => (
                                    <Box key={i} sx={{ flex: 1, backgroundColor: '#4caf50', height: `${val}%`, borderRadius: '2px 2px 0 0' }}></Box>
                                ))}
                            </Box>
                        </Box>
                    </Box>
                </CardContent>
            </Card>
        );

        const PinnedVehiclesCard = ({ sx }) => (
            <Card sx={sx}>
                <CardContent>
                    <Typography variant='h6' gutterBottom>Pinned Vehicles</Typography>
                    <Box sx={{ mt: 2 }}>
                        {['VEH-1234', 'VEH-5678', 'VEH-9012', 'VEH-3456'].map((veh, i) => (
                            <Box key={i} sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', py: 1, borderBottom: i < 3 ? '1px solid #eee' : 'none' }}>
                                <Box>
                                    <Typography variant="body2" fontWeight={600}>{veh}</Typography>
                                    <Typography variant="caption" color="text.secondary">Toyota Corolla • {['On Rent', 'Available', 'NRM', 'On Rent'][i]}</Typography>
                                </Box>
                                <IconButton size="small">
                                    <span className="material-icons" style={{fontSize: 18}}>chevron_right</span>
                                </IconButton>
                            </Box>
                        ))}
                    </Box>
                </CardContent>
            </Card>
        );

        const NRMBreakdownCard = ({ sx }) => (
            <Card sx={sx}>
                <CardContent>
                    <Typography variant='h6' gutterBottom>NRM Breakdown</Typography>

                            <Box key={i} sx={{
                                backgroundColor: cat.color,
                                color: 'white',

                                flexDirection: 'column',

                },
                gridAutoFlow: 'row dense',
            };

            const titleCards = { gridColumn: { xs: 1, sm: '1 / 3', md: '1 / 4', lg: '1 / 5', xl: '1 / 6' } };

                                <Button variant="contained" size="small">Dashboard</Button>
                            </Box>
                        </Box>

                        <Box sx={{ mb: 2, display: 'flex', gap: 2, flexWrap: 'wrap' }}>
                            <Button variant="outlined" sx={{ minWidth: 200 }}>All Stations</Button>
                            <Button variant="outlined" sx={{ minWidth: 200 }}>All Geofences</Button>
                            <Button variant="contained" color="primary">Search</Button>
                        </Box>

                        <Box sx={gridContainer}>
                            <TitleCard sx={titleCards} />
                            <IssuesToAddressCard

                                stockAnomalies={15}
                                inactiveNrms={8}
                                highMileageVehicles={42}

                                maintenanceOverdue={5}

                                rentalOverdue={2}

                            <NRMBreakdownCard sx={nrmBreakdownCardSx} />
                            <DeviceIssuesCard sx={deviceIssuesCardSx} />
                            <AnomalyBreakdownCard sx={anomalyCardSx} />
                            <FleetSizeTrendCard sx={fleetCardsx} />
                            <TreemapCard sx={treemapCardSx} />
                        </Box>
                    </Box>
                </ThemeProvider>
            );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FleetDashboard />);
    </script>
</body>
